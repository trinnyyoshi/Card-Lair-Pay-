<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay Card Lair</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    background: radial-gradient(circle at top, #1a1a1a 0%, #0b0b0b 60%);
    color: white;
    font-family: -apple-system, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
    margin: 0;
    min-height: 100vh;
  }
  .logo {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    margin-bottom: 14px;
    box-shadow: 0 0 0 3px #2a2a2a, 0 8px 24px rgba(0,0,0,0.6);
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }
  .sub {
    color: #999;
    font-size: 0.95rem;
    margin: 0 0 32px;
    text-align: center;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 18px;
    width: 100%;
    max-width: 340px;
  }
  .card {
    background: #161616;
    border: 1px solid #262626;
    border-radius: 16px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:active { transform: scale(0.98); }
  .cashapp { border-left: 4px solid #00d632; }
  .venmo { border-left: 4px solid #3D95CE; }
  .paypal { border-left: 4px solid #00457C; }
  .collectr { border-left: 4px solid #8B5CF6; }
  .qr-box {
    background: white;
    padding: 8px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .info h2 {
    margin: 0 0 2px;
    font-size: 1.05rem;
    color: white;
  }
  .cashapp .tag { color: #00d632; }
  .venmo .tag { color: #3D95CE; }
  .paypal .tag { color: #4fc3f7; }
  .collectr .tag { color: #a78bfa; }
  .tag {
    margin: 0;
    font-size: 0.88rem;
    font-weight: 600;
  }
  .tap-hint {
    margin: 0;
    font-size: 0.75rem;
    color: #777;
    margin-top: 4px;
  }
  footer {
    margin-top: 36px;
    color: #555;
    font-size: 0.8rem;
    text-align: center;
  }
</style>
</head>
